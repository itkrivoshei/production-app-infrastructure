name: production-app-infrastructure

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: devops-control-center-api:local
    container_name: devops-control-center-api
    environment:
      APP_NAME: devops-control-center-api
      APP_ENV: docker
      APP_VERSION: ${APP_VERSION:-0.1.0}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_DEMO_LOAD: ${ENABLE_DEMO_LOAD:-true}
      ENABLE_DEMO_ERRORS: ${ENABLE_DEMO_ERRORS:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    expose:
      - "8080"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3001}
        VITE_PROMETHEUS_URL: ${VITE_PROMETHEUS_URL:-http://localhost:9090}
        VITE_API_DOCS_URL: /api/docs
    image: devops-control-center-web:local
    container_name: devops-control-center-web
    expose:
      - "80"
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: devops-control-center-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
