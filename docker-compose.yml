name: production-app-infrastructure

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-app-security: &app-security
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: devops-control-center-api:local
    environment:
      APP_NAME: devops-control-center-api
      APP_ENV: ${APP_ENV:-local}
      APP_MODE: ${APP_MODE:-safe}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DEMO_RATE_LIMIT: ${DEMO_RATE_LIMIT:-10}
    expose:
      - "8080"
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    <<: *app-security
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3001}
        VITE_PROMETHEUS_URL: ${VITE_PROMETHEUS_URL:-http://localhost:9090}
        VITE_LOKI_URL: ${VITE_LOKI_URL:-http://localhost:3100}
        VITE_API_DOCS_URL: /api/docs
    image: devops-control-center-web:local
    expose:
      - "8080"
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    <<: *app-security
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginxinc/nginx-unprivileged:1.29-alpine3.23
    ports:
      - "${NGINX_BIND_ADDRESS:-0.0.0.0}:${NGINX_PORT:-3000}:8080"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    <<: *app-security
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devops-control-center.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  loki:
    image: grafana/loki:3.5.7
    profiles: [observability]
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./ops/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  alloy:
    image: grafana/alloy:v1.11.3
    profiles: [observability]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./ops/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      loki:
        condition: service_healthy

  k6:
    image: grafana/k6:1.7.1
    profiles: [tools]
    entrypoint:
      - k6
    environment:
      TARGET_BASE_URL: http://nginx:8080
    volumes:
      - ./load:/scripts:ro
    networks:
      - app-network
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      nginx:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
