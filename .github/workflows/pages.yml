name: GitHub Pages Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static UI preview
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static dashboard preview
        run: pnpm --filter @production-app-infrastructure/web build
        env:
          VITE_DEMO_MODE: static
          VITE_BASE_PATH: /production-app-infrastructure/
          VITE_API_DOCS_URL: https://github.com/itkrivoshei/production-app-infrastructure/blob/main/docs/demo.md
          VITE_PROMETHEUS_URL: https://github.com/itkrivoshei/production-app-infrastructure/blob/main/docs/demo.md
          VITE_GRAFANA_URL: https://github.com/itkrivoshei/production-app-infrastructure/blob/main/docs/demo.md
          VITE_LOKI_URL: https://github.com/itkrivoshei/production-app-infrastructure/blob/main/docs/logging.md
          VITE_REPOSITORY_URL: https://github.com/itkrivoshei/production-app-infrastructure
          VITE_LOCAL_SERVICES_AVAILABLE: "false"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run static Pages browser E2E
        run: E2E_MODE=pages pnpm exec playwright test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy:
    name: Deploy static UI preview
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
