name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci

  infrastructure:
    name: Infrastructure configuration gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Initialize Terraform without backend
        run: terraform -chdir=infra/terraform/aws init -backend=false -input=false

      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform/aws fmt -check -recursive
          terraform -chdir=infra/terraform/aws validate -no-color
          terraform -chdir=infra/terraform/aws test -no-color

      - name: Validate Docker Compose configuration
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.demo.yml \
            --profile observability \
            --profile tools \
            config --quiet

      - name: Validate observability configuration
        run: bash scripts/validate-observability.sh

      - name: Validate rollback ref selection
        run: ./scripts/rollback-demo.sh --dry-run

  integration:
    name: Safe/demo Compose integration and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Compose integration, k6 smoke, and browser E2E
        run: RUN_BROWSER_E2E=true pnpm integration:compose
