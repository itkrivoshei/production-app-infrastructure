pid /tmp/nginx.pid;

events {}

http {
  include /etc/nginx/mime.types;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64k;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

  upstream web_upstream {
    server web:8080;
  }

  upstream api_upstream {
    server api:8080;
  }

  server {
    listen 8080;
    server_name _;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:" always;

    location /nginx-health {
      access_log off;
      return 200 "nginx ok\n";
      add_header Content-Type text/plain;
    }

    location /api/docs {
      limit_req zone=api_limit burst=200 nodelay;
      proxy_pass http://api_upstream/docs;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:" always;
    }

    location /api/ {
      limit_req zone=api_limit burst=200 nodelay;
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      proxy_send_timeout 15s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
