services:
  api:
    image: ${ROLLBACK_IMAGE:-devops-control-center-api:rollback-current}
    pull_policy: never
    environment:
      APP_NAME: devops-control-center-api
      APP_ENV: rollback-demo
      APP_VERSION: ${APP_VERSION:-0.1.0}
      COMMIT_SHA: ${COMMIT_SHA:-rollback-current}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_MODE: safe
    ports:
      - "${ROLLBACK_PORT:-8091}:8080"
    networks:
      - rollback-network
    restart: "no"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12

networks:
  rollback-network:
    driver: bridge
